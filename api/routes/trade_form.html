<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade tester</title>
<style>
  :root {
    --ground:#f4f6f8; --card:#fff; --sunken:#eef1f5; --ink:#16202b; --muted:#5f6b7a;
    --faint:#8b95a3; --line:#d8dee6;
    --accent:#2c4b8c; --accent-soft:#e9eef8;
    --good:#17714f; --good-soft:#e4f2ea;
    --bad:#a8362a;  --bad-soft:#fae9e6;
    --warn:#8a5a08; --warn-soft:#fbf0dc;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0f1319; --card:#171d26; --sunken:#10151c; --ink:#e2e7ef; --muted:#96a0ae;
      --faint:#6d7784; --line:#2a323d;
      --accent:#7fa3e8; --accent-soft:#1b2537;
      --good:#4fba93; --good-soft:#12271f;
      --bad:#e2705d;  --bad-soft:#2b1714;
      --warn:#d09a44; --warn-soft:#2a2013;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink);
         font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:20px 20px 60px; }
  h1 { font-size:21px; margin:0; }
  .sub { color:var(--muted); margin:2px 0 0; font-size:13.5px; }

  /* ---------- status strip ---------- */
  .status { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 20px; align-items:center; }
  .pill { display:flex; align-items:baseline; gap:7px; padding:7px 12px; border-radius:20px;
          border:1px solid var(--line); background:var(--card); font-size:12.5px; white-space:nowrap; }
  .pill .k { color:var(--faint); text-transform:uppercase; letter-spacing:.06em; font-size:10.5px; font-weight:600; }
  .pill .v { font-family:var(--mono); font-weight:600; }
  .pill.ok   { background:var(--good-soft); border-color:var(--good); }
  .pill.ok .v{ color:var(--good); }
  .pill.no   { background:var(--bad-soft);  border-color:var(--bad); }
  .pill.no .v{ color:var(--bad); }
  .pill.wait { background:var(--warn-soft); border-color:var(--warn); }
  .pill.wait .v{ color:var(--warn); }
  .refresh { margin-left:auto; }

  .cols { display:grid; grid-template-columns:380px 1fr; gap:20px; align-items:start; }
  @media (max-width:900px) { .cols { grid-template-columns:1fr; } }

  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px; }
  .card + .card { margin-top:16px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.09em;
             color:var(--faint); margin:0 0 12px; font-weight:600; }

  fieldset { border:none; padding:0; margin:0 0 16px; }
  legend { font-size:11px; text-transform:uppercase; letter-spacing:.09em;
           color:var(--faint); font-weight:600; padding:0 0 8px; }
  label { display:block; margin-bottom:11px; font-size:13px; font-weight:500; }
  label .hint { display:block; font-weight:400; color:var(--muted); font-size:12px; margin-top:2px; }
  input, select { width:100%; margin-top:5px; padding:9px 10px; font-size:14px; font-family:inherit;
                  color:var(--ink); background:var(--ground); border:1px solid var(--line); border-radius:5px; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .idrow { display:flex; gap:8px; align-items:flex-end; }
  .idrow label { flex:1; margin-bottom:0; }

  button { font:inherit; font-weight:600; padding:11px 14px; border-radius:6px;
           border:1px solid transparent; cursor:pointer; width:100%; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .btn-test { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .btn-real { background:var(--bad); color:#fff; margin-top:10px; }
  .btn-small { width:auto; padding:8px 12px; font-size:12.5px; font-weight:500;
               background:var(--ground); color:var(--muted); border-color:var(--line); }

  .placeholder { color:var(--muted); font-size:14px; padding:44px 0; text-align:center; }
  .banner { padding:12px 14px; border-radius:6px; font-weight:600; margin-bottom:14px; font-size:14px; }
  .b-good { background:var(--good-soft); color:var(--good); }
  .b-bad  { background:var(--bad-soft);  color:var(--bad); }
  .b-warn { background:var(--warn-soft); color:var(--warn); }

  .prices { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .price { padding:12px; border:1px solid var(--line); border-radius:6px; text-align:center; }
  .price .lab { font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); font-weight:600; }
  .price .val { font-family:var(--mono); font-size:23px; font-weight:600; margin-top:3px; }
  .price .sub2 { font-size:11px; color:var(--muted); margin-top:2px; }
  .p-tp { border-color:var(--good); }  .p-tp .val { color:var(--good); }
  .p-sl { border-color:var(--bad); }   .p-sl .val { color:var(--bad); }
  .p-en { border-color:var(--accent); } .p-en .val { color:var(--accent); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { padding:7px 0; border-bottom:1px solid var(--line); vertical-align:top; text-align:left; }
  td:first-child, th:first-child { color:var(--muted); }
  td:last-child { font-family:var(--mono); font-size:12.5px; }
  tr:last-child td { border-bottom:none; }
  table.grid td, table.grid th { padding:6px 8px; font-size:12.5px; }
  table.grid th { color:var(--faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; }
  table.grid td { font-family:var(--mono); }
  .pos { color:var(--good); } .neg { color:var(--bad); }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover td { background:var(--sunken); }
  tr.clickable.on td { background:var(--accent-soft); }
  .naked { background:var(--bad-soft); color:var(--bad); font-weight:600;
           padding:10px 12px; border-radius:6px; font-size:13px; margin-bottom:12px; }
  .safe  { background:var(--good-soft); color:var(--good); font-weight:600;
           padding:10px 12px; border-radius:6px; font-size:13px; margin-bottom:12px; }
  .pnlbig { font-family:var(--mono); font-size:26px; font-weight:600; }

  .chip { display:inline-block; font-family:var(--mono); font-size:10.5px; font-weight:600;
          letter-spacing:.05em; padding:2px 7px; border-radius:3px; }
  .c-fill { background:var(--good-soft); color:var(--good); }
  .c-work { background:var(--warn-soft); color:var(--warn); }
  .c-dead { background:var(--bad-soft);  color:var(--bad); }

  details { margin-top:10px; }
  summary { cursor:pointer; font-size:12.5px; color:var(--muted); }
  pre { background:var(--sunken); border:1px solid var(--line); border-radius:6px; padding:12px;
        overflow-x:auto; font-family:var(--mono); font-size:11.5px; margin:8px 0 0; max-height:380px; }
  .note { font-size:12px; color:var(--muted); margin:12px 0 0; }
  .live { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--good);
          margin-right:5px; vertical-align:1px; }
  @media (prefers-reduced-motion: no-preference) {
    .live { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Trade tester</h1>
  <p class="sub">Test freely. Nothing is bought until you press the red button.</p>

  <div class="status" id="status">
    <span class="pill"><span class="k">Server</span><span class="v">checking…</span></span>
    <button type="button" class="btn-small refresh" id="refreshall">Refresh</button>
  </div>

  <div class="cols">
    <!-- ================= LEFT ================= -->
    <div>
      <form class="card" id="form" autocomplete="off">
        <fieldset>
          <legend>Access</legend>
          <label>API key
            <span class="hint">TIGER_API_KEY from .env. Saved in this browser only.</span>
            <input type="password" id="apikey" placeholder="paste your key">
          </label>
        </fieldset>

        <fieldset>
          <legend>What to buy</legend>
          <div class="row">
            <label>Symbol<input id="symbol" value="AAPL"></label>
            <label>Call or put
              <select id="option_type"><option>CALL</option><option>PUT</option></select>
            </label>
          </div>
          <div class="row">
            <label>Stock price
              <span class="hint">picks the strike</span>
              <input type="number" step="0.01" id="current_price" value="318.40">
            </label>
            <label>Contracts<input type="number" step="1" min="1" id="quantity" value="1"></label>
          </div>
          <label>Strikes out of the money
            <span class="hint">whole strikes only, never in the money</span>
            <select id="strikes_out">
              <option value="1" selected>1st OTM</option>
              <option value="2">2nd OTM</option>
              <option value="3">3rd OTM</option>
            </select>
          </label>
          <label>Expiry
            <span class="hint">blank = soonest monthly at least 3 days out</span>
            <select id="expiry"><option value="">auto-pick</option></select>
          </label>
          <label>Option price
            <span class="hint">blank = fetch the last traded price, free, seconds old</span>
            <input type="number" step="0.01" id="entry_price" placeholder="leave blank to fetch">
          </label>
          <label style="font-weight:400;font-size:12.5px">
            <input type="checkbox" id="require_live_trading" checked
                   style="width:auto;margin:0 6px 0 0;vertical-align:-1px">
            Refuse if the contract has not traded this minute
          </label>
        </fieldset>

        <fieldset>
          <legend>Exits</legend>
          <div class="row">
            <label>Take profit %<input type="number" step="1" id="take_profit_percent" value="20"></label>
            <label>Stop loss %<input type="number" step="1" id="stop_loss_percent" value="15"></label>
          </div>
          <label>Legs live for
            <select id="leg_time_in_force">
              <option value="GTC">GTC — survive overnight (safer)</option>
              <option value="DAY">DAY — die at close</option>
            </select>
          </label>
        </fieldset>

        <fieldset>
          <legend>This order</legend>
          <div class="idrow">
            <label>Order ID<input id="client_order_id"></label>
            <button type="button" class="btn-small" id="newid">New</button>
          </div>
        </fieldset>

        <button type="button" class="btn-test" id="test">Test — buys nothing</button>
        <button type="button" class="btn-real" id="place">Place the order for real</button>
        <p class="note" id="realnote"></p>
      </form>

      <div class="card">
        <h2>Positions held &mdash; click one</h2>
        <div id="positions"><div class="placeholder">…</div></div>
      </div>
    </div>

    <!-- ================= RIGHT ================= -->
    <div>
      <div class="card">
        <h2>Result</h2>
        <div id="out"><div class="placeholder">Press Test to see what would happen.</div></div>
      </div>

      <div class="card" id="detailcard" hidden>
        <h2 style="display:flex;align-items:center;gap:8px">
          <span class="live"></span>Position &mdash; live
          <select id="detailrate" style="width:auto;margin:0 0 0 auto;padding:3px 6px;font-size:11px">
            <option value="2000" selected>every 2s</option>
            <option value="3000">every 3s</option>
            <option value="5000">every 5s</option>
            <option value="10000">every 10s</option>
          </select>
        </h2>
        <div id="detailbox"></div>
      </div>

      <div class="card" id="livecard" hidden>
        <h2><span class="live"></span>Live order — updating every 3s</h2>
        <div id="livebox"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const out = $("out");
let liveTimer = null;
let liveOrderId = null;

/* ---------- helpers ---------- */
const money = n => (n === null || n === undefined) ? "—" : Number(n).toFixed(2);
const key   = () => $("apikey").value.trim();
const hdrs  = () => ({ "Content-Type": "application/json", "X-API-Key": key() });

function statusChip(s) {
  const t = String(s || "").toUpperCase();
  if (t.includes("FILLED") && !t.includes("PARTIAL")) return `<span class="chip c-fill">${t}</span>`;
  if (t.includes("CANCEL") || t.includes("REJECT") || t.includes("EXPIRE"))
    return `<span class="chip c-dead">${t}</span>`;
  return `<span class="chip c-work">${t || "—"}</span>`;
}

function newId() {
  const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "");
  $("client_order_id").value = "ui-" + stamp + "-" + Math.random().toString(36).slice(2, 6);
}
newId();
$("newid").onclick = newId;

try { const k = localStorage.getItem("tigerApiKey"); if (k) $("apikey").value = k; } catch (e) {}
$("apikey").onchange = () => {
  try { localStorage.setItem("tigerApiKey", $("apikey").value); } catch (e) {}
  refreshAll();
};

/* ---------- status strip ---------- */
async function loadStatus() {
  const strip = $("status");
  if (!key()) {
    strip.innerHTML = `<span class="pill no"><span class="k">API key</span><span class="v">not set</span></span>`;
    strip.appendChild(refreshBtn());
    return;
  }
  try {
    const r = await fetch("/health", { headers: hdrs() });
    if (!r.ok) throw new Error(r.status === 401 ? "key rejected" : "HTTP " + r.status);
    const h = await r.json();

    const canTrade = h.orders_enabled;
    $("place").disabled = !canTrade;
    $("realnote").textContent = canTrade
      ? "Orders are ENABLED. The red button will spend money."
      : "Blocked: DRY_RUN is true in .env. Change it and RESTART the server.";

    strip.innerHTML = `
      <span class="pill ${canTrade ? "ok" : "no"}">
        <span class="k">Orders</span><span class="v">${canTrade ? "ENABLED" : "BLOCKED"}</span></span>
      <span class="pill ${h.dry_run ? "wait" : "ok"}">
        <span class="k">Dry run</span><span class="v">${h.dry_run ? "TRUE" : "FALSE"}</span></span>
      <span class="pill ${h.mode === "PAPER" ? "ok" : "no"}">
        <span class="k">Mode</span><span class="v">${h.mode}</span></span>
      <span class="pill"><span class="k">Account</span><span class="v">${h.account_masked}</span></span>
      <span class="pill"><span class="k">Quotes</span><span class="v">${h.market_data_source}</span></span>`;
    strip.appendChild(refreshBtn());
  } catch (e) {
    strip.innerHTML = `<span class="pill no"><span class="k">Server</span><span class="v">${e.message}</span></span>`;
    strip.appendChild(refreshBtn());
  }
}

function refreshBtn() {
  const b = document.createElement("button");
  b.type = "button"; b.className = "btn-small refresh"; b.textContent = "Refresh";
  b.onclick = refreshAll;
  return b;
}

/* ---------- positions ---------- */
async function loadPositions() {
  const box = $("positions");
  if (!key()) { box.innerHTML = `<div class="placeholder">Enter your API key.</div>`; return; }
  try {
    const r = await fetch("/positions", { headers: hdrs() });
    const d = await r.json();
    if (!r.ok) { box.innerHTML = `<div class="placeholder">${d.message || "failed"}</div>`; return; }
    if (!d.positions.length) { box.innerHTML = `<div class="placeholder">Nothing held.</div>`; return; }

    box.innerHTML = `<table class="grid">
      <tr><th>Contract</th><th>Qty</th><th>Cost</th><th>P&amp;L</th><th>DTE</th></tr>` +
      d.positions.map(p => {
        const pnl = p.tiger_unrealised_pnl;
        const cls = pnl == null ? "" : (pnl >= 0 ? "pos" : "neg");
        return `<tr class="clickable" data-id="${p.identifier.replace(/"/g, "&quot;")}">
          <td>${p.underlying} ${p.strike} ${p.option_type[0]}</td>
          <td>${p.quantity}</td>
          <td>${money(p.cost_basis)}</td>
          <td class="${cls}">${pnl == null ? "—" : (pnl >= 0 ? "+" : "") + money(pnl)}</td>
          <td>${p.days_to_expiry}${p.expiring_soon ? " ⚠" : ""}</td>
        </tr>`;
      }).join("") + `</table>`;

    box.querySelectorAll("tr.clickable").forEach(row => {
      row.onclick = () => showPosition(row.dataset.id);
      if (row.dataset.id === detailId) row.classList.add("on");
    });
  } catch (e) {
    box.innerHTML = `<div class="placeholder">${e.message}</div>`;
  }
}

/* ---------- one position, priced live ---------- */
let detailId = null;
let detailTimer = null;
// Guards against stacking. The call is usually ~576ms but has been seen at
// 3179ms, so at a 2s interval a slow one is still running when the next
// fires. Skipping a tick beats piling requests up.
let detailBusy = false;

function detailInterval() {
  return parseInt($("detailrate").value, 10) || 5000;
}

function startDetailTimer() {
  if (detailTimer) clearInterval(detailTimer);
  detailTimer = setInterval(pollDetail, detailInterval());
}

function showPosition(identifier) {
  detailId = identifier;
  $("detailcard").hidden = false;
  pollDetail();
  startDetailTimer();
  loadPositions();
}

async function pollDetail() {
  if (!detailId || detailBusy) return;
  detailBusy = true;
  const box = $("detailbox");
  try {
    const r = await fetch(`/positions/detail?identifier=${encodeURIComponent(detailId)}`,
                          { headers: hdrs() });
    const d = await r.json();
    if (!r.ok) {
      box.innerHTML = `<div class="placeholder">${(d.error || d).message || "failed"}</div>`;
      clearInterval(detailTimer); detailTimer = null;
      return;
    }

    const up = (d.unrealised_pnl ?? 0) >= 0;
    const guard = d.has_stop_loss
      ? `<div class="safe">${d.protection_note}</div>`
      : `<div class="naked">${d.protection_note}</div>`;

    box.innerHTML = guard + `
      <div style="text-align:center;margin-bottom:14px">
        <div class="pnlbig ${up ? "pos" : "neg"}">${up ? "+" : ""}${money(d.unrealised_pnl)}</div>
        <div style="font-size:12px;color:var(--muted)">
          ${up ? "+" : ""}${d.unrealised_pnl_percent}% &nbsp;unrealised</div>
      </div>
      <table>
        <tr><td>Contract</td><td>${d.identifier}</td></tr>
        <tr><td>Held</td><td>${d.quantity} x ${d.multiplier}, ${d.days_to_expiry} days left</td></tr>
        <tr><td>You paid</td><td>${money(d.average_cost)} &nbsp;= $${money(d.cost_basis)}</td></tr>
        <tr><td>Now</td><td>${d.current_price == null ? "no price"
            : money(d.current_price) + " &nbsp;(" + Math.round(d.price_age_seconds) + "s old)"}</td></tr>
        <tr><td>Worth</td><td>${d.current_value == null ? "—" : "$" + money(d.current_value)}</td></tr>
      </table>
      <h2 style="margin-top:16px">Orders working on it</h2>
      ${d.working_orders.length
        ? `<table class="grid"><tr><th>Role</th><th>Type</th><th>Price</th><th>TIF</th><th>Status</th></tr>` +
          d.working_orders.map(o => `<tr>
            <td class="${o.role === "STOP_LOSS" ? "neg" : (o.role === "TAKE_PROFIT" ? "pos" : "")}">${o.role}</td>
            <td>${o.action} ${o.order_type || ""}</td>
            <td>${o.price == null ? "—" : money(o.price)}</td>
            <td>${o.time_in_force || "—"}</td>
            <td>${statusChip(o.status)}</td></tr>`).join("") + `</table>`
        : `<div class="placeholder" style="padding:14px 0">No orders on this contract.</div>`}
      <p class="note">The price is a LAST TRADE from free bars, not a bid.
         You would sell into the bid, which is lower.</p>`;
  } catch (e) {
    box.innerHTML = `<div class="placeholder">${e.message}</div>`;
  } finally {
    detailBusy = false;
  }
}

async function loadExpiries() {
  const sel = $("expiry");
  const keep = sel.value;
  if (!key()) return;
  try {
    const r = await fetch(`/expirations/${$("symbol").value.trim().toUpperCase()}`,
                          { headers: hdrs() });
    if (!r.ok) return;
    const d = await r.json();
    sel.innerHTML = `<option value="">auto-pick</option>` +
      d.expirations.filter(e => !e.expired).map(e =>
        `<option value="${e.date}">${e.date} — ${e.days_to_expiry}d, ${e.period}</option>`
      ).join("");
    sel.value = keep;
  } catch (e) { /* leave the dropdown as it is */ }
}
$("symbol").onchange = loadExpiries;
$("detailrate").onchange = () => { if (detailId) startDetailTimer(); };

function refreshAll() { loadStatus(); loadPositions(); loadExpiries(); if (detailId) pollDetail(); }
refreshAll();

/* ---------- the request ---------- */
function body(validateOnly) {
  const priceBox = $("entry_price").value.trim();
  const expiryBox = $("expiry").value;
  return {
    client_order_id: $("client_order_id").value.trim(),
    symbol: $("symbol").value.trim().toUpperCase(),
    option_type: $("option_type").value,
    current_price: parseFloat($("current_price").value),
    quantity: parseInt($("quantity").value, 10),
    ...(priceBox === "" ? {} : { entry_price: parseFloat(priceBox) }),
    ...(expiryBox === "" ? {} : { expiry: expiryBox }),
    strikes_out: parseInt($("strikes_out").value, 10),
    require_live_trading: $("require_live_trading").checked,
    take_profit_percent: parseFloat($("take_profit_percent").value),
    stop_loss_percent: parseFloat($("stop_loss_percent").value),
    leg_time_in_force: $("leg_time_in_force").value,
    validate_only: validateOnly
  };
}

function renderError(status, data) {
  const d = (data && data.error) ? data.error : data;
  out.innerHTML = `
    <div class="banner b-bad">${status} &nbsp;·&nbsp; ${(d && d.error_code) || "ERROR"}</div>
    <p style="font-size:14px;margin:0 0 4px">${(d && d.message) || JSON.stringify(data)}</p>
    <details><summary>Full response</summary><pre>${JSON.stringify(data, null, 2)}</pre></details>`;
}

function renderOk(data, exactOrderId) {
  const p = data.prices, real = !data.validate_only;
  const banner = data.duplicate
    ? `<div class="banner b-warn">Duplicate — this repeats an earlier order. Nothing new was placed.</div>`
    : real
      ? `<div class="banner b-good">ORDER PLACED &nbsp;·&nbsp; id ${exactOrderId || data.order_id}</div>`
      : `<div class="banner b-warn">Test only — nothing was bought</div>`;

  out.innerHTML = banner + `
    <div class="prices">
      <div class="price p-sl"><div class="lab">Stop loss</div><div class="val">${money(p.stop_loss_price)}</div>
        <div class="sub2">−${p.stop_loss_percent}%</div></div>
      <div class="price p-en"><div class="lab">You buy at</div><div class="val">${money(p.entry_price_actual)}</div>
        <div class="sub2">you sent ${money(p.entry_price_requested)}</div></div>
      <div class="price p-tp"><div class="lab">Take profit</div><div class="val">${money(p.take_profit_price)}</div>
        <div class="sub2">+${p.take_profit_percent}%</div></div>
    </div>
    <table>
      <tr><td>Contract</td><td>${data.contract.identifier}</td></tr>
      <tr><td>Strike / expiry</td><td>${data.strike} &nbsp; ${data.expiry} &nbsp;(${data.contract.days_to_expiry}d)</td></tr>
      <tr><td>Why this strike</td><td style="font-family:inherit">${data.strike_selection_reason}</td></tr>
      <tr><td>Why this expiry</td><td style="font-family:inherit">${data.expiry_selection_reason}</td></tr>
      <tr><td>Option price from</td><td>${data.price_source.source === "caller"
          ? "you"
          : (data.price_source.is_live
              ? `<span class="pos">TRADING NOW</span> — ${data.price_source.recent_volume} this minute`
              : `<span class="neg">not trading this minute</span>`)}
          &nbsp;$${money(data.price_source.price)}</td></tr>
      <tr><td>Buffer applied</td><td>+${data.tick.buffer_ticks} tick of ${data.tick.tick_size}</td></tr>
      <tr><td>Cash needed</td><td>$${money(data.cash_required)}</td></tr>
      <tr><td>Commission round trip</td><td>$${money(data.commission.round_trip)}</td></tr>
      <tr><td>Legs sent</td><td>${(data.legs_submitted || []).map(l =>
          `${l.leg_kind} ${l.order_type} @ ${money(l.price)} ${l.time_in_force || ""}`).join("<br>") || "—"}</td></tr>
    </table>
    <details><summary>Full response</summary><pre>${JSON.stringify(data, null, 2)}</pre></details>`;

  if (real && exactOrderId) startLive(exactOrderId);
}

/* ---------- live order tracking ---------- */
function startLive(orderId) {
  liveOrderId = String(orderId);   // a STRING, never a Number -- see above
  $("livecard").hidden = false;
  if (liveTimer) clearInterval(liveTimer);
  pollLive();
  liveTimer = setInterval(pollLive, 3000);
}

let liveBusy = false;

async function pollLive() {
  if (!liveOrderId || liveBusy) return;
  liveBusy = true;
  const box = $("livebox");
  try {
    const [oRes, lRes] = await Promise.all([
      fetch(`/orders/${liveOrderId}`, { headers: hdrs() }),
      fetch(`/orders/${liveOrderId}/legs`, { headers: hdrs() })
    ]);
    const o = await oRes.json();
    const l = lRes.ok ? await lRes.json() : { legs: [] };

    const done = /FILLED|CANCEL|REJECT|EXPIRE/.test(String(o.status || "").toUpperCase())
                 && !/PARTIAL/.test(String(o.status || "").toUpperCase());

    box.innerHTML = `
      <table>
        <tr><td>Order</td><td>${liveOrderId}</td></tr>
        <tr><td>Status</td><td>${statusChip(o.status)}</td></tr>
        <tr><td>Filled</td><td>${o.filled ?? 0}</td></tr>
        <tr><td>Avg fill price</td><td>${o.avg_fill_price == null ? "not yet" : money(o.avg_fill_price)}</td></tr>
        <tr><td>Actual cash</td><td>${o.actual_cash == null ? "—" : "$" + money(o.actual_cash)}</td></tr>
      </table>
      <h2 style="margin-top:16px">Exits on the book</h2>
      ${(l.legs || []).length
        ? `<table class="grid"><tr><th>Leg</th><th>Type</th><th>Price</th><th>TIF</th><th>Status</th></tr>` +
          l.legs.map(g => `<tr><td>${g.leg_kind || "—"}</td><td>${g.order_type || "—"}</td>
            <td>${g.price == null ? "—" : money(g.price)}</td><td>${g.time_in_force || "—"}</td>
            <td>${statusChip(g.status)}</td></tr>`).join("") + `</table>`
        : `<div class="placeholder" style="padding:16px 0">No legs reported yet.</div>`}
      <p class="note">${done ? "Parent settled — polling stopped." : "Refreshing every 3 seconds…"}</p>`;

    if (done) { clearInterval(liveTimer); liveTimer = null; loadPositions(); }
  } catch (e) {
    box.innerHTML = `<div class="placeholder">${e.message}</div>`;
  } finally {
    liveBusy = false;
  }
}

/* ---------- send ---------- */
async function send(validateOnly, button) {
  if (!key()) {
    out.innerHTML = `<div class="banner b-bad">No API key</div>
      <p style="font-size:14px">Paste TIGER_API_KEY from your .env into the first box.</p>`;
    return;
  }
  const buttons = [$("test"), $("place")];
  const labels = buttons.map(b => b.textContent);
  buttons.forEach(b => b.disabled = true);
  button.textContent = "Working…";
  out.innerHTML = `<div class="placeholder">Talking to Tiger…</div>`;

  const started = performance.now();
  try {
    const r = await fetch("/trade", { method: "POST", headers: hdrs(), body: JSON.stringify(body(validateOnly)) });
    // Read the TEXT first. Order ids are bigger than 2^53, so JSON.parse turns
    // 44561462560050176 into 44561462560050180 -- an id the broker has never
    // heard of. Pull the digits out as a string before anything parses them.
    const raw = await r.text();
    const idMatch = raw.match(/"order_id"\s*:\s*(\d+)/);
    const exactOrderId = idMatch ? idMatch[1] : null;
    const data = JSON.parse(raw);
    const ms = Math.round(performance.now() - started);
    if (r.ok) {
      renderOk(data, exactOrderId);
      out.insertAdjacentHTML("beforeend", `<p class="note">Round trip: ${ms} ms</p>`);
      if (!validateOnly) { newId(); loadPositions(); }
    } else {
      renderError(r.status, data);
    }
  } catch (e) {
    out.innerHTML = `<div class="banner b-bad">Could not reach the server</div>
      <p style="font-size:14px">${e.message}. Is it still running?</p>`;
  } finally {
    buttons.forEach((b, i) => { b.textContent = labels[i]; });
    loadStatus();
  }
}

$("test").onclick = e => send(true, e.target);
$("place").onclick = e => {
  const typed = $("entry_price").value.trim();
  const cost = typed === "" ? "the fetched price" : (typed * 100 * $("quantity").value).toFixed(2);
  if (confirm(`Place a REAL order?\n\n${$("quantity").value} x ${$("symbol").value} ${$("option_type").value}\nroughly $${cost}\n\nThis spends money.`)) {
    send(false, e.target);
  }
};
